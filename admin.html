<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BatiSense Pro — Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f1117;
      --surface: #1a1d27;
      --border:  #2a2d3a;
      --accent:  #4f8ef7;
      --danger:  #ef4444;
      --warning: #f59e0b;
      --success: #22c55e;
      --text:    #e2e8f0;
      --muted:   #64748b;
      --radius:  10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-brand { font-size: 17px; font-weight: 700; color: var(--accent); }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .nav-email { color: var(--muted); font-size: 13px; }

    .btn-nav {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
      transition: border-color .2s, color .2s;
      display: inline-block;
    }
    .btn-nav:hover { border-color: var(--accent); color: var(--accent); }
    .btn-logout { color: var(--danger); }
    .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

    main { max-width: 1300px; margin: 0 auto; padding: 32px 24px; }

    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 28px; }

    /* STATS */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .stat-card .lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .stat-card .val { font-size: 28px; font-weight: 700; }
    .c-accent  { color: var(--accent); }
    .c-success { color: var(--success); }
    .c-warning { color: var(--warning); }
    .c-danger  { color: var(--danger); }

    /* TOOLBAR */
    .toolbar { display: flex; gap: 10px; margin-bottom: 14px; }
    .search-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }

    .btn-refresh {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: opacity .2s;
    }
    .btn-refresh:hover { opacity: 0.85; }

    /* TABLE */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: auto;
    }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    thead { background: #12151f; }
    th {
      text-align: left;
      padding: 11px 14px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(79,142,247,.04); }

    .user-name  { font-weight: 600; }
    .user-email { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .meta       { color: var(--muted); font-size: 12px; }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-alert { background: rgba(239,68,68,.15); color: var(--danger); }
    .badge-ok    { background: rgba(34,197,94,.10); color: var(--success); }

    .btn-delete {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--danger);
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      transition: background .2s, border-color .2s;
    }
    .btn-delete:hover { background: rgba(239,68,68,.1); border-color: var(--danger); }

    .state-row td { text-align: center; padding: 48px; color: var(--muted); }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .3s, transform .3s;
      pointer-events: none;
      z-index: 999;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.err  { border-color: var(--danger); color: var(--danger); }
  </style>
</head>
<body>

<nav>
  <span class="nav-brand">⚙️ BatiSense Admin</span>
  <div class="nav-right">
    <span class="nav-email" id="navEmail"></span>
    <button class="btn-nav btn-logout" onclick="logout()">Déconnexion</button>
  </div>
</nav>

<main>
  <h1>Panneau d'administration</h1>
  <p class="subtitle">Gestion des utilisateurs BatiSense Pro</p>

  <div class="stats-grid">
    <div class="stat-card"><div class="lbl">Utilisateurs</div><div class="val c-accent"  id="sUsers">—</div></div>
    <div class="stat-card"><div class="lbl">Lectures</div>    <div class="val c-success" id="sReadings">—</div></div>
    <div class="stat-card"><div class="lbl">Alertes actives</div><div class="val c-danger"  id="sAlerts">—</div></div>
    <div class="stat-card"><div class="lbl">Tokens Pi</div>   <div class="val c-warning" id="sTokens">—</div></div>
  </div>

  <div class="toolbar">
    <input class="search-input" id="search" type="text" placeholder="Rechercher par nom, email, ville…" oninput="filter()"/>
    <button class="btn-refresh" onclick="loadAll()">↻ Actualiser</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Utilisateur</th>
          <th>Adresse</th>
          <th>Inscrit le</th>
          <th>Lectures</th>
          <th>Alertes</th>
          <th>Tokens</th>
          <th>Dernière activité</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr class="state-row"><td colspan="9"><span class="spinner"></span>Chargement…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<div id="toast"></div>

<script>
  let all = [];

  async function loadAll() {
    loadStats();
    loadUsers();
  }

  async function loadStats() {
    try {
      const d = await fetch("/api/admin/stats", { credentials: "include" }).then(r => r.json());
      document.getElementById("sUsers").textContent    = d.total_users;
      document.getElementById("sReadings").textContent = d.total_readings.toLocaleString();
      document.getElementById("sAlerts").textContent   = d.active_alerts;
      document.getElementById("sTokens").textContent   = d.total_tokens;
    } catch(e) {}
  }

  async function loadUsers() {
    const tbody = document.getElementById("tbody");
    tbody.innerHTML = `<tr class="state-row"><td colspan="9"><span class="spinner"></span>Chargement…</td></tr>`;
    try {
      const r = await fetch("/api/admin/users", { credentials: "include" });
      if (r.status === 302 || r.redirected) { window.location.href = "/admin/login"; return; }
      all = await r.json();
      render(all);
    } catch(e) {
      tbody.innerHTML = `<tr class="state-row"><td colspan="9">Erreur de chargement.</td></tr>`;
    }
  }

  function render(users) {
    const tbody = document.getElementById("tbody");
    if (!users.length) {
      tbody.innerHTML = `<tr class="state-row"><td colspan="9">Aucun utilisateur.</td></tr>`;
      return;
    }
    tbody.innerHTML = users.map(u => {
      const name     = `${u.first_name} ${u.last_name}`;
      const addr     = [u.street, u.city, u.zip_code].filter(Boolean).join(", ") || "—";
      const date     = u.created_at ? u.created_at.slice(0, 10) : "—";
      const lastSeen = u.last_seen  ? u.last_seen.slice(0, 16).replace("T", " ") : "Jamais";
      const alertBadge = u.alerts_count > 0
        ? `<span class="badge badge-alert">${u.alerts_count}</span>`
        : `<span class="badge badge-ok">0</span>`;
      return `
        <tr data-q="${name.toLowerCase()} ${u.email.toLowerCase()} ${(u.city||"").toLowerCase()}">
          <td class="meta">${u.id}</td>
          <td>
            <div class="user-name">${name}</div>
            <div class="user-email">${u.email}</div>
          </td>
          <td class="meta">${addr}</td>
          <td class="meta">${date}</td>
          <td>${u.readings_count.toLocaleString()}</td>
          <td>${alertBadge}</td>
          <td class="meta">${u.tokens_count}</td>
          <td class="meta">${lastSeen}</td>
          <td>
            <button class="btn-delete" onclick="del(${u.id}, '${name.replace(/'/g,"\\'")}')">🗑 Supprimer</button>
          </td>
        </tr>`;
    }).join("");
  }

  function filter() {
    const q = document.getElementById("search").value.toLowerCase().trim();
    if (!q) { render(all); return; }
    render(all.filter(u => {
      return `${u.first_name} ${u.last_name} ${u.email} ${u.city||""} ${u.street||""}`.toLowerCase().includes(q);
    }));
  }

  async function del(id, name) {
    if (!confirm(`Supprimer "${name}" et toutes ses données ?\nCette action est irréversible.`)) return;
    try {
      const r = await fetch(`/api/admin/users/${id}`, { method: "DELETE", credentials: "include" });
      const d = await r.json();
      if (d.ok) { toast(`"${name}" supprimé.`); loadAll(); }
      else toast(d.error || "Erreur.", true);
    } catch(e) { toast("Erreur réseau.", true); }
  }

  async function logout() {
    await fetch("/admin/logout", { method: "POST", credentials: "include" });
    window.location.href = "/admin/login";
  }

  function toast(msg, isErr=false) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className = "show" + (isErr ? " err" : "");
    setTimeout(() => el.className = "", 3000);
  }

  // verify session & load admin email
  fetch("/api/admin/me", { credentials: "include" })
    .then(r => { if (!r.ok) window.location.href = "/admin/login"; return r.json(); })
    .then(d => { if (d.email) document.getElementById("navEmail").textContent = d.email; })
    .catch(() => window.location.href = "/admin/login");

  loadAll();
</script>
</body>
</html>
