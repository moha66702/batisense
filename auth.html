<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BatiSense Pro — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<!-- Inlined SVG favicon -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cdefs%3E%3ClinearGradient id='gMark' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2300f5a0'/%3E%3Cstop offset='60%25' stop-color='%2300d4e0'/%3E%3Cstop offset='100%25' stop-color='%234d8dff'/%3E%3C/linearGradient%3E%3ClinearGradient id='gDark' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%230d1424'/%3E%3Cstop offset='100%25' stop-color='%23090e1a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='120' height='120' rx='22' fill='url(%23gDark)'/%3E%3Cpolygon points='60,16 98,48 98,96 22,96 22,48' fill='none' stroke='url(%23gMark)' stroke-width='3' stroke-linejoin='round'/%3E%3Ccircle cx='60' cy='16' r='4' fill='url(%23gMark)'/%3E%3Crect x='46' y='68' width='28' height='28' rx='14' fill='none' stroke='url(%23gMark)' stroke-width='2.5'/%3E%3Ccircle cx='60' cy='53' r='5' fill='url(%23gMark)'/%3E%3Cpath d='M 47,43 Q 60,30 73,43' fill='none' stroke='url(%23gMark)' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg0:#050810;--bg1:#090e1a;--bg2:#0d1424;--bg3:#121c30;--bg4:#182338;
  --b0:rgba(255,255,255,.04);--b1:rgba(255,255,255,.08);--b2:rgba(255,255,255,.14);
  --green:#00f5a0;--teal:#00d4e0;--blue:#4d8dff;--amber:#ffc233;--red:#ff4d6b;--violet:#a06bff;
  --t0:#dce8ff;--t1:#7d95bc;--t2:#3d5070;
  --r:12px;--rsm:7px;
  --fui:'Syne',sans-serif;--fmono:'DM Mono',monospace;
  --glow-g:0 0 32px rgba(0,245,160,.15);
  --glow-t:0 0 32px rgba(0,212,224,.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px;-webkit-font-smoothing:antialiased}
body{
  font-family:var(--fui);
  background:var(--bg0);
  color:var(--t0);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}
body::before {
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 30%, rgba(0,245,160,.06) 0%, transparent 70%),
    radial-gradient(ellipse 50% 60% at 80% 70%, rgba(0,212,224,.05) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 50% 50%, rgba(77,141,255,.04) 0%, transparent 70%);
  pointer-events:none;
  animation:bgPulse 8s ease-in-out infinite alternate;
}
@keyframes bgPulse {
  from { opacity:.6; }
  to   { opacity:1; }
}
body::after {
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
}
.page-wrap {
  position:relative;
  z-index:10;
  width:100%;
  max-width:440px;
  padding:16px;
}

/* ── Logo / Brand ── */
.brand {
  display:flex;
  align-items:center;
  gap:0;
  justify-content:center;
  margin-bottom:28px;
  animation: fadeDown .5s ease both;
}
/* Show the full horizontal logo SVG on the login page */
.brand-logo-full {
  display:block;
  /* constrain to a comfortable width */
  width: 260px;
  height: auto;
}

/* ── Card ── */
.card {
  background:var(--bg1);
  border:1px solid var(--b1);
  border-radius:16px;
  padding:28px 30px;
  box-shadow: 0 24px 64px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.03);
  animation: fadeUp .4s ease both .1s;
  position:relative;
  overflow:hidden;
}
.card::before {
  content:'';
  position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--green),var(--teal),var(--blue));
  border-radius:16px 16px 0 0;
}

/* ── Tabs ── */
.tabs {
  display:flex;
  background:var(--bg0);
  border:1px solid var(--b0);
  border-radius:var(--rsm);
  padding:3px;
  margin-bottom:24px;
}
.tab-btn {
  flex:1;
  padding:8px;
  border:none;
  background:none;
  color:var(--t2);
  font-family:var(--fui);
  font-size:12.5px;
  font-weight:600;
  border-radius:5px;
  cursor:pointer;
  transition:all .2s;
  letter-spacing:.3px;
}
.tab-btn.active {
  background:var(--bg3);
  color:var(--green);
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}

/* ── Form ── */
.form-section { display:none; }
.form-section.active { display:block; animation:fadeUp .25s ease both; }

.form-title {
  font-size:17px;
  font-weight:700;
  letter-spacing:-.4px;
  margin-bottom:4px;
}
.form-sub {
  font-size:11.5px;
  color:var(--t1);
  margin-bottom:20px;
  line-height:1.5;
}

.field { margin-bottom:14px; }
.field-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
label {
  display:block;
  font-size:11px;
  font-weight:600;
  color:var(--t2);
  text-transform:uppercase;
  letter-spacing:.7px;
  margin-bottom:5px;
}
input {
  width:100%;
  padding:9px 12px;
  background:var(--bg0);
  border:1px solid var(--b1);
  border-radius:var(--rsm);
  color:var(--t0);
  font-family:var(--fui);
  font-size:13px;
  outline:none;
  transition:border-color .2s, box-shadow .2s;
}
input::placeholder { color:var(--t2); }
input:focus {
  border-color:rgba(0,245,160,.4);
  box-shadow:0 0 0 3px rgba(0,245,160,.07);
}
input.err { border-color:rgba(255,77,107,.5); }

.form-divider {
  font-size:10px;
  color:var(--t2);
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:600;
  margin:16px 0 12px;
  display:flex;align-items:center;gap:8px;
}
.form-divider::before,.form-divider::after{
  content:'';flex:1;height:1px;background:var(--b1);
}

.btn-submit {
  width:100%;
  padding:11px;
  background:linear-gradient(135deg,var(--green),var(--teal));
  border:none;
  border-radius:var(--rsm);
  color:#000;
  font-family:var(--fui);
  font-size:13.5px;
  font-weight:800;
  letter-spacing:.3px;
  cursor:pointer;
  margin-top:18px;
  transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow: 0 4px 20px rgba(0,245,160,.25);
}
.btn-submit:hover {
  transform:translateY(-1px);
  box-shadow:0 8px 28px rgba(0,245,160,.35);
}
.btn-submit:active { transform:translateY(0); }
.btn-submit:disabled {
  opacity:.5;cursor:not-allowed;transform:none;
}

.msg {
  padding:9px 13px;
  border-radius:var(--rsm);
  font-size:12px;
  font-weight:500;
  margin-top:12px;
  display:none;
  align-items:center;
  gap:8px;
}
.msg.show { display:flex; }
.msg.error   { background:rgba(255,77,107,.1);  border:1px solid rgba(255,77,107,.25);  color:var(--red); }
.msg.success { background:rgba(0,245,160,.08);  border:1px solid rgba(0,245,160,.2);    color:var(--green); }

.spinner {
  width:14px;height:14px;
  border:2px solid rgba(0,0,0,.3);
  border-top-color:#000;
  border-radius:50%;
  animation:spin .6s linear infinite;
  display:none;
}
.btn-submit.loading .spinner { display:block; }
.btn-submit.loading .btn-label { display:none; }
@keyframes spin { to { transform:rotate(360deg); } }

@keyframes fadeUp   { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeDown { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }

.auth-footer {
  text-align:center;
  font-size:10.5px;
  color:var(--t2);
  margin-top:16px;
  font-family:var(--fmono);
  animation:fadeUp .4s ease both .3s;
}
</style>
</head>
<body>

<div class="page-wrap">
  <!-- Full horizontal BatiSense logo -->
  <div class="brand">
    <svg class="brand-logo-full" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180">
      <defs>
        <linearGradient id="gGreen" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00f5a0"/>
          <stop offset="100%" stop-color="#00d4e0"/>
        </linearGradient>
        <linearGradient id="gDark" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0d1424"/>
          <stop offset="100%" stop-color="#090e1a"/>
        </linearGradient>
        <linearGradient id="gMark" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00f5a0"/>
          <stop offset="60%" stop-color="#00d4e0"/>
          <stop offset="100%" stop-color="#4d8dff"/>
        </linearGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
          <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="softglow">
          <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
          <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- Background -->
      <rect width="480" height="180" rx="16" fill="url(#gDark)"/>
      <!-- Subtle grid texture -->
      <line x1="0" y1="60" x2="480" y2="60" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
      <line x1="0" y1="120" x2="480" y2="120" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
      <line x1="160" y1="0" x2="160" y2="180" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
      <line x1="320" y1="0" x2="320" y2="180" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
      <!-- Glow blob behind mark -->
      <ellipse cx="75" cy="90" rx="55" ry="50" fill="rgba(0,245,160,0.06)" filter="url(#softglow)"/>
      <!-- House shape -->
      <polygon points="75,28 110,62 110,118 40,118 40,62" fill="none" stroke="url(#gMark)" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow)"/>
      <!-- Roof peak cap -->
      <circle cx="75" cy="28" r="3.5" fill="url(#gMark)" filter="url(#glow)"/>
      <!-- Door -->
      <rect x="62" y="90" width="26" height="28" rx="13" fill="none" stroke="url(#gMark)" stroke-width="2" opacity="0.9"/>
      <!-- Inner dot / sensor -->
      <circle cx="75" cy="73" r="4" fill="url(#gMark)" filter="url(#glow)"/>
      <!-- Signal arcs -->
      <path d="M 63,64 Q 75,52 87,64" fill="none" stroke="url(#gMark)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <path d="M 56,57 Q 75,40 94,57" fill="none" stroke="url(#gMark)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
      <!-- Corner accent lines -->
      <line x1="32" y1="118" x2="20" y2="118" stroke="url(#gGreen)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      <line x1="20" y1="118" x2="20" y2="106" stroke="url(#gGreen)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      <line x1="118" y1="118" x2="130" y2="118" stroke="url(#gGreen)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      <line x1="130" y1="118" x2="130" y2="106" stroke="url(#gGreen)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      <!-- Divider -->
      <line x1="148" y1="40" x2="148" y2="140" stroke="rgba(0,245,160,0.15)" stroke-width="1"/>
      <!-- WORDMARK: BATI -->
      <text x="168" y="100"
        font-family="'Arial Black', 'Impact', sans-serif"
        font-size="58" font-weight="900" letter-spacing="-2"
        fill="url(#gMark)" filter="url(#glow)">BATI</text>
      <!-- SENSE -->
      <text x="168" y="100"
        font-family="'Arial Black', 'Impact', sans-serif"
        font-size="58" font-weight="900" letter-spacing="-2"
        fill="rgba(220,232,255,0.92)" dx="132">SENSE</text>
      <!-- Tagline -->
      <text x="170" y="128"
        font-family="'Courier New', monospace"
        font-size="11" letter-spacing="4"
        fill="rgba(0,245,160,0.55)" font-weight="400">SMART HOME MONITORING</text>
      <!-- PRO badge -->
      <rect x="420" y="18" width="44" height="18" rx="5" fill="rgba(0,245,160,0.1)" stroke="rgba(0,245,160,0.25)" stroke-width="1"/>
      <text x="442" y="31" text-anchor="middle"
        font-family="'Courier New', monospace"
        font-size="9.5" fill="rgba(0,245,160,0.7)" letter-spacing="1">PRO</text>
      <!-- Bottom accent bar -->
      <rect x="168" y="140" width="280" height="2" rx="1" fill="url(#gGreen)" opacity="0.3"/>
      <rect x="168" y="140" width="80" height="2" rx="1" fill="url(#gGreen)" opacity="0.8"/>
    </svg>
  </div>

  <!-- Card -->
  <div class="card">
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">
        <i class="fas fa-sign-in-alt" style="margin-right:5px;font-size:11px"></i> Connexion
      </button>
      <button class="tab-btn" id="tab-register" onclick="switchTab('register')">
        <i class="fas fa-user-plus" style="margin-right:5px;font-size:11px"></i> Créer un compte
      </button>
    </div>

    <!-- LOGIN FORM -->
    <div class="form-section active" id="section-login">
      <div class="form-title">Bon retour 👋</div>
      <div class="form-sub">Connectez-vous pour accéder à votre tableau de bord.</div>

      <div class="field">
        <label><i class="fas fa-envelope" style="margin-right:4px;opacity:.6"></i> Adresse e-mail</label>
        <input type="email" id="login-email" placeholder="votre@email.com" autocomplete="email">
      </div>
      <div class="field">
        <label><i class="fas fa-lock" style="margin-right:4px;opacity:.6"></i> Mot de passe</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <div class="msg" id="login-msg"></div>

      <button class="btn-submit" id="login-btn" onclick="doLogin()">
        <div class="spinner"></div>
        <span class="btn-label"><i class="fas fa-arrow-right"></i> &nbsp;Se connecter</span>
      </button>
    </div>

    <!-- REGISTER FORM -->
    <div class="form-section" id="section-register">
      <div class="form-title">Créer un compte</div>
      <div class="form-sub">Remplissez vos informations pour commencer à surveiller votre bâtiment.</div>

      <div class="field field-row">
        <div>
          <label>Prénom</label>
          <input type="text" id="reg-firstname" placeholder="Jean" autocomplete="given-name">
        </div>
        <div>
          <label>Nom</label>
          <input type="text" id="reg-lastname" placeholder="Dupont" autocomplete="family-name">
        </div>
      </div>
      <div class="field">
        <label><i class="fas fa-envelope" style="margin-right:4px;opacity:.6"></i> Adresse e-mail</label>
        <input type="email" id="reg-email" placeholder="votre@email.com" autocomplete="email">
      </div>
      <div class="field">
        <label><i class="fas fa-lock" style="margin-right:4px;opacity:.6"></i> Mot de passe <span style="color:var(--t2);text-transform:none;letter-spacing:0">(min. 8 caractères)</span></label>
        <input type="password" id="reg-password" placeholder="••••••••" autocomplete="new-password">
      </div>

      <div class="form-divider">Adresse du bâtiment</div>

      <div class="field">
        <label><i class="fas fa-map-marker-alt" style="margin-right:4px;opacity:.6"></i> Rue</label>
        <input type="text" id="reg-street" placeholder="12 rue de la Paix" autocomplete="street-address">
      </div>
      <div class="field field-row">
        <div>
          <label>Ville</label>
          <input type="text" id="reg-city" placeholder="Paris" autocomplete="address-level2">
        </div>
        <div>
          <label>Code postal</label>
          <input type="text" id="reg-zip" placeholder="75001" autocomplete="postal-code">
        </div>
      </div>

      <div class="msg" id="register-msg"></div>

      <button class="btn-submit" id="register-btn" onclick="doRegister()">
        <div class="spinner"></div>
        <span class="btn-label"><i class="fas fa-user-plus"></i> &nbsp;Créer mon compte</span>
      </button>
    </div>
  </div>

  <div class="auth-footer">
    BatiSense Pro · Système de surveillance intelligent
  </div>
</div>

<script>
"use strict";
const API_BASE = "https://batisense-production.up.railway.app";

function switchTab(tab) {
  document.getElementById("section-login").classList.toggle("active", tab === "login");
  document.getElementById("section-register").classList.toggle("active", tab === "register");
  document.getElementById("tab-login").classList.toggle("active", tab === "login");
  document.getElementById("tab-register").classList.toggle("active", tab === "register");
  clearMsgs();
}

function clearMsgs() {
  ["login-msg","register-msg"].forEach(id => {
    const el = document.getElementById(id);
    el.className = "msg";
    el.textContent = "";
  });
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.className = `msg ${type} show`;
  el.innerHTML = `<i class="fas ${type==='error'?'fa-exclamation-circle':'fa-check-circle'}"></i> ${text}`;
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  btn.classList.toggle("loading", loading);
  btn.disabled = loading;
}

async function doLogin() {
  const email    = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;

  if (!email || !password) {
    showMsg("login-msg", "Veuillez remplir tous les champs.", "error");
    return;
  }

  setLoading("login-btn", true);
  clearMsgs();

  try {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();

    if (res.ok) {
      showMsg("login-msg", "Connexion réussie. Redirection…", "success");
      setTimeout(() => window.location.href = "/dashboard", 800);
    } else {
      showMsg("login-msg", data.error || "Erreur de connexion.", "error");
      setLoading("login-btn", false);
    }
  } catch {
    showMsg("login-msg", "Impossible de joindre le serveur.", "error");
    setLoading("login-btn", false);
  }
}

async function doRegister() {
  const payload = {
    first_name: document.getElementById("reg-firstname").value.trim(),
    last_name:  document.getElementById("reg-lastname").value.trim(),
    email:      document.getElementById("reg-email").value.trim(),
    password:   document.getElementById("reg-password").value,
    street:     document.getElementById("reg-street").value.trim(),
    city:       document.getElementById("reg-city").value.trim(),
    zip_code:   document.getElementById("reg-zip").value.trim(),
  };

  for (const [k, v] of Object.entries(payload)) {
    if (!v) {
      showMsg("register-msg", "Veuillez remplir tous les champs.", "error");
      return;
    }
  }
  if (payload.password.length < 8) {
    showMsg("register-msg", "Le mot de passe doit contenir au moins 8 caractères.", "error");
    return;
  }

  setLoading("register-btn", true);
  clearMsgs();

  try {
    const res = await fetch(`${API_BASE}/auth/register`, {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();

    if (res.ok) {
      showMsg("register-msg", "Compte créé ! Redirection…", "success");
      setTimeout(() => window.location.href = "/dashboard", 900);
    } else {
      showMsg("register-msg", data.error || "Erreur lors de la création.", "error");
      setLoading("register-btn", false);
    }
  } catch {
    showMsg("register-msg", "Impossible de joindre le serveur.", "error");
    setLoading("register-btn", false);
  }
}

document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const loginActive = document.getElementById("section-login").classList.contains("active");
  if (loginActive) doLogin();
  else doRegister();
});
</script>
</body>
</html>
